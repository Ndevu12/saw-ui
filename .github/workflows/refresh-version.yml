# Keeps the version shown on the site current without a paid deploy hook and without a
# rebuild on every check. On a schedule it compares the latest release on PyPI to the
# version the site currently serves at /version.json; only when they differ (i.e. a
# release happened since the last deploy) does it redeploy, and the redeploy's build
# re-reads PyPI so the chip updates. The visitor's browser still talks only to our own
# origin — this all happens in CI, never in the page.
#
# GitHub: Settings → Secrets and variables → Actions.
# Vercel values come from the dashboard, not from this file.
#
# Secrets:
#   VERCEL_PROJECT_ID   Vercel → open this project → Settings → General →
#                       Project ID (the prj_… field on that page)
#   VERCEL_ORG_ID       Vercel → top-left Hobby/team switcher → Settings →
#                       General → Team ID
#                       (not on the project page; a project ID alone is not enough)
#   VERCEL_TOKEN        Vercel → account menu (bottom-left avatar) →
#                       Account Settings → Tokens → Create
#                       (must belong to the same account as that Team ID)
#
# Variables:
#   VERCEL_PROJECT      Vercel → Settings → General → Project Name
#                       (the name only, last path segment, not the vercel.com/… URL)
#   VERCEL_SCOPE        optional; the team/user slug in the dashboard URL
#   SITE_URL            public origin the job reads /version.json from, with scheme
name: Refresh displayed version

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-version
  cancel-in-progress: false

env:
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Latest release on PyPI
        id: pypi
        run: echo "v=$(curl -fsSL https://pypi.org/pypi/stayawakebot/json | jq -r '.info.version')" >> "$GITHUB_OUTPUT"

      - name: Version currently on the site
        id: live
        run: echo "v=$(curl -fsSL "$SITE_URL/version.json" | jq -r '.version' 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Decide
        id: decide
        run: |
          if [ -z "${{ steps.pypi.outputs.v }}" ]; then
            echo "PyPI lookup failed — skipping."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.pypi.outputs.v }}" = "${{ steps.live.outputs.v }}" ]; then
            echo "Site already shows ${{ steps.pypi.outputs.v }} — no redeploy."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "PyPI ${{ steps.pypi.outputs.v }} != site '${{ steps.live.outputs.v }}' — redeploying."; echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out
        if: steps.decide.outputs.go == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Redeploy (build re-reads PyPI)
        if: steps.decide.outputs.go == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
          VERCEL_SCOPE: ${{ vars.VERCEL_SCOPE }}
        run: |
          if [ -n "$VERCEL_PROJECT" ]; then
            set -- --yes --project "$VERCEL_PROJECT" --token="$VERCEL_TOKEN"
            if [ -n "$VERCEL_SCOPE" ]; then
              set -- "$@" --scope "$VERCEL_SCOPE"
            fi
            npx --yes vercel@latest link "$@"
          fi
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
